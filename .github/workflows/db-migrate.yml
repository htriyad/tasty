name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg client
        run: sudo apt-get install -y postgresql-client

      - name: Run migration SQL (IPv4 forced)
        env:
          PGPASSWORD: my1stprojec
        run: |
          # Resolve to IPv4 explicitly
          HOST_IP=$(getent ahostsv4 db.lngxtnsgbnoklcycvuhz.supabase.co | awk '{print $1}' | head -1)
          echo "Connecting to $HOST_IP"
          psql "postgresql://postgres@${HOST_IP}:5432/postgres?sslmode=require&sslrootcert=disable" <<'ENDSQL'
          CREATE TABLE IF NOT EXISTS folders (
            id SERIAL PRIMARY KEY,
            name TEXT NOT NULL,
            parent_id INTEGER,
            color TEXT NOT NULL DEFAULT '#6366f1',
            icon TEXT NOT NULL DEFAULT 'folder',
            style TEXT NOT NULL DEFAULT 'default',
            position INTEGER NOT NULL DEFAULT 0,
            created_at TIMESTAMP NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS question_sets (
            id SERIAL PRIMARY KEY,
            folder_id INTEGER NOT NULL REFERENCES folders(id) ON DELETE CASCADE,
            name TEXT NOT NULL,
            exam_type TEXT,
            total_questions INTEGER NOT NULL DEFAULT 0,
            source_url TEXT,
            sort_order INTEGER NOT NULL DEFAULT 0,
            created_at TIMESTAMP NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS questions (
            id SERIAL PRIMARY KEY,
            set_id INTEGER NOT NULL REFERENCES question_sets(id) ON DELETE CASCADE,
            chorcha_id TEXT NOT NULL,
            question_index INTEGER NOT NULL,
            type TEXT NOT NULL,
            question_text TEXT NOT NULL DEFAULT '',
            options JSONB NOT NULL DEFAULT '[]',
            parts JSONB NOT NULL DEFAULT '[]',
            answer TEXT,
            solution TEXT,
            stem_images TEXT[] NOT NULL DEFAULT '{}',
            ai_explanation TEXT,
            hidden BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMP NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS set_question_links (
            id SERIAL PRIMARY KEY,
            question_id INTEGER NOT NULL REFERENCES questions(id) ON DELETE CASCADE,
            set_id INTEGER NOT NULL REFERENCES question_sets(id) ON DELETE CASCADE,
            question_index INTEGER NOT NULL DEFAULT 0,
            hidden_parts TEXT[] NOT NULL DEFAULT '{}',
            created_at TIMESTAMP NOT NULL DEFAULT NOW(),
            CONSTRAINT uq_link UNIQUE (question_id, set_id)
          );
          ENDSQL
          echo 'All tables created successfully'
