name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (attempt 1)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://tasty-api-jwy1.onrender.com/api/healthz)
          echo "Attempt 1 → HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render is alive"
            exit 0
          fi
          echo "⏳ Cold start detected, waiting 20s..."
          sleep 20

      - name: Wake up Render (attempt 2 — cold start recovery)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://tasty-api-jwy1.onrender.com/api/healthz)
          echo "Attempt 2 → HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render awake after retry"
          else
            echo "⚠️ Render still not responding (status $STATUS)"
          fi

      - name: Verify data endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://tasty-api-jwy1.onrender.com/api/folders)
          echo "Data endpoint → HTTP $STATUS"
